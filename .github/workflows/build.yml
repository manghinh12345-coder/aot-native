name: build-native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: git clone --depth 1 --branch b5200 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Configure
        run: |
          cmake -S jni -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_DIR=$GITHUB_WORKSPACE/llama.cpp

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Strip
        run: $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/libaot_llama.so

      - uses: actions/upload-artifact@v4
        with:
          name: libaot_llama
          path: build/libaot_llama.so
